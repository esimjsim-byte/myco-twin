[project]
name = "mycelium-db"
version = "0.1.0"
description = "Database app for mushroom mycelium cultivation conditions — compares biomass and β-glucan across carbon/nitrogen sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.83",
    "pandas>=2.2",
    "streamlit>=1.37",
    "plotly>=5.23",
    "anthropic>=0.39",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "lxml>=5.2",
    "requests>=2.32",
    "tqdm>=4.67.3",
    "scikit-learn>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tapo Monitor 대시보드</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Tapo Monitor</h1>
      <div class="status">
        <span id="alert-summary" class="pill ok">정상</span>
        <span id="last-updated" class="muted">—</span>
        <span id="conn" class="pill ok">● live</span>
      </div>
    </header>

    <section class="grid" id="zone-grid"><!-- zone cards injected here --></section>

    <section class="charts">
      <div class="chart-head">
        <h2>시간별 그래프</h2>
        <label>
          구간:
          <select id="hours-select">
            <option value="1">최근 1시간</option>
            <option value="6" selected>최근 6시간</option>
            <option value="24">최근 24시간</option>
          </select>
        </label>
        <label>
          구역:
          <select id="zone-select"></select>
        </label>
      </div>
      <div class="chart-wrap"><canvas id="temp-chart"></canvas></div>
      <div class="chart-wrap"><canvas id="hum-chart"></canvas></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
